name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "43 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # CodeQL does not support Elixir or HEEx. This covers browser source
        # and CI workflows; audit.yml separately checks Hex dependencies.
        language: [javascript-typescript, actions]

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          # Analyze maintained source rather than generated bundles or vendor
          # code. Add new source directories here if the project grows.
          config: |
            paths:
              - apps/portal/assets/js
              - .github/workflows

      - name: Analyze and upload results
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
