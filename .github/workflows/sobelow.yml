name: Sobelow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "34 5 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sobelow-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: portal
            flags: ""
          - app: ncc_worker
            flags: --no-router
          - app: compatibility
            flags: --no-router
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "28"

      - name: Install analysis dependencies
        run: |
          mix deps.get
          git diff --exit-code mix.lock
          mix deps.compile

      - name: Analyze application
        id: scan
        # Run from the umbrella root so SARIF paths remain repository-relative.
        # --private disables Sobelow's update check; the scanner is lock-pinned.
        run: >-
          mix sobelow --root apps/${{ matrix.app }} ${{ matrix.flags }}
          --private --strict --exit low --format sarif
          --out "$RUNNER_TEMP/sobelow.sarif"

      # Upload findings even when the scan fails, retaining the failure status.
      - name: Upload report
        if: ${{ !cancelled() && (steps.scan.outcome == 'success' || steps.scan.outcome == 'failure') }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/sobelow.sarif
          category: sobelow-${{ matrix.app }}
