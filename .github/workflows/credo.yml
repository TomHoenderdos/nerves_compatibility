name: Credo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "36 2 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: credo-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: "1.20"
          otp-version: "28"

      - name: Install analysis dependencies
        run: |
          mix deps.get
          git diff --exit-code mix.lock
          mix deps.compile

      - name: Analyze Elixir source
        id: scan
        run: mix credo --format=sarif > "$RUNNER_TEMP/credo.sarif"

      # Findings must not prevent the report from reaching code scanning.
      # Keep the scan's failure status; do not mute or ignore its exit code.
      - name: Upload report
        if: ${{ !cancelled() && (steps.scan.outcome == 'success' || steps.scan.outcome == 'failure') }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/credo.sarif
          category: credo
