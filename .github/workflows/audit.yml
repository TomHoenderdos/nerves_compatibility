name: audit

# Dependency advisory audit. This is the blocking copy of the check: a
# vulnerable `mix.lock` fails here and shows red on the commit.
#
# The schedule is the reason this workflow exists at all. `push` only tells us
# about locks we changed; most advisories arrive as *upstream* publications
# against a lock that has not moved in weeks, and nothing would surface those
# until the next unrelated commit.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 06:17 UTC. Deliberately off the hour: scheduled runs on the :00
    # mark queue behind everyone else's and drift by tens of minutes.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deps-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Match the release container in ops/build-release.sh. The audit only
      # reads mix.lock, so the versions are not load-bearing for the result —
      # they are here so a compile error surfaces on the same toolchain that
      # builds production.
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "28"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - run: mix deps.get

      # `mix deps.get` run from inside `apps/portal` or `apps/ncc_worker`
      # rewrites the *shared root* `mix.lock` and prunes every dependency the
      # child app does not declare -- which includes mix_audit, since an
      # umbrella root's own deps are invisible to its children. That has already
      # dropped mix_audit out of the lock once, and a pruned lock audits clean
      # for the worst possible reason: the auditor is no longer in it.
      #
      # `deps.get` above re-adds anything missing, so by the time this step runs
      # the symptom has healed itself -- which is exactly what makes it a good
      # check. If the committed lock was pruned (or is merely stale), `deps.get`
      # just repaired it in the working tree and the diff is non-empty.
      - name: mix.lock is current
        run: |
          git diff --exit-code mix.lock || {
            echo "::error::mix.lock changed after 'mix deps.get'. Most likely a mix deps task was run from inside apps/* -- that rewrites the shared root lock and prunes root-only deps such as mix_audit. Re-run 'mix deps.get' from the repo root and commit the result."
            exit 1
          }

      # `deps.audit` reads mix.lock, but the task itself lives in mix_audit,
      # whose yaml_elixir dependency is only put on the code path by
      # `deps.loadpaths`. Running `mix deps.audit` alone dies with
      # `function YamlElixir.read_from_file/1 is undefined`.
      - name: Dependency advisories (mix_audit)
        run: mix do deps.loadpaths + deps.audit

      # Not redundant with mix_audit. mix_audit reads a mirror of the GitHub
      # Advisory Database; this asks hex.pm, which carries EEF-issued CVEs the
      # mirror can lag on. The first finding this workflow ever produced -- 29
      # advisories across the ash family -- came from here, against a lock
      # mix_audit called clean. Advisory reporting needs Hex >= 2.5;
      # setup-beam installs current Hex, so this is only a trap locally.
      - name: Advisories and retired packages (hex.pm)
        run: mix hex.audit
